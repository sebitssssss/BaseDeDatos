# Code Breaker - archivo de configuracion (formato clave=valor)
# Las lineas que empiezan con # son comentarios.
# Si este archivo se borra, el juego lo vuelve a crear con estos valores.

# --- Conexion a MySQL (base de la materia Base de Datos) ---
db_server=localhost
db_port=3306
db_name=codigo_secreto_db
db_user=root
db_password=

# --- Reglas del juego ---
# Longitud del codigo secreto (de 2 a 6)
code_length=4
# Vidas (de 1 a 12): cada intento que no acierta resta una
lives=8
# Puntaje al ganar = vidas * points_per_life + max(0, time_bonus_max - segundos)
points_per_life=100
time_bonus_max=300
# true muestra el codigo secreto durante la partida (solo para las pruebas en clase)
debug_show_secret=false

# --- Sprites de Content/Sprites: nombre de un PNG suelto o de una SubTexture de un XML ---
# Primero se busca el nombre exacto; si no aparece, el primer nombre que contenga el texto.
# Ver assets/README.md para poner los nombres exactos del pack descargado.
sprite_red=rojo.png
sprite_blue=azul.png
sprite_green=verde.png
sprite_yellow=amarillo.png
sprite_orange=naranja.png
sprite_purple=morado.png
# Aro de cada ficha del historial: verde = lugar correcto, amarillo = otro lugar, rojo = no esta
sprite_frame_exact=aro_verde.png
sprite_frame_present=aro_amarillo.png
sprite_frame_absent=aro_rojo.png
sprite_cursor=
sprite_empty=
